apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: hackathon

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx

      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - name: http
              containerPort: 80

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html

      volumes:
        - name: html
          configMap:
            name: nginx-html
